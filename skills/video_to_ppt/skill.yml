name: video_to_ppt
description: Agent Skill，支持本地视频 / mp4直链 / B站/抖音/小红书网页链接，语音转文字，LLM生成PPT大纲，根据每页标题内容自动生成配图，输出pptx文件。⚠️仅限个人学习使用，注意版权！
version: 0.5.0
parameters:
  type: object
  properties:
    video_path:
      type: string
      description: 本地视频文件路径（二选一，和video_url不能同时填写），支持mp4/mov
      default: ""
    video_url:
      type: string
      description: 视频链接，支持mp4直链、B站、抖音、小红书网页链接；部分平台视频需要填写cookie才能解析
      default: ""
    cookie_string:
      type: string
      description: 【可选】浏览器Cookie文本，用于解析需要登录观看的平台视频
      default: ""
    output_pptx_path:
      type: string
      description: PPT输出保存路径，例如 ./output/result.pptx
    slide_count:
      type: integer
      description: 生成PPT幻灯片页数
      default: 8
    llm_api_key:
      type: string
      description: LLM接口密钥，不填则使用简易文本分割模式
      default: ""
    llm_base_url:
      type: string
      description: LLM接口地址
      default: "https://api.openai.com/v1"
    llm_model:
      type: string
      description: LLM模型名称
      default: "gpt-3.5-turbo"
    enable_images:
      type: boolean
      description: 是否开启每页自动生成配图
      default: true
    image_provider:
      type: string
      description: 图片生成服务商，可选 openai / siliconflow / custom
      default: "openai"
    image_api_key:
      type: string
      description: 文生图API密钥，为空则复用llm_api_key
      default: ""
    image_base_url:
      type: string
      description: 文生图接口地址
      default: ""
    image_model:
      type: string
      description: 文生图模型名称
      default: "dall-e-3"
  required:
    - output_pptx_path
returns:
  type: object
  description: 返回PPT大纲、生成文件路径、配图信息
  properties:
    outline_markdown:
      type: string
      description: PPT大纲markdown文本
    ppt_file_path:
      type: string
      description: 生成的pptx文件路径
    raw_transcript:
      type: string
      description: 视频识别出的完整字幕文本
    slide_images:
      type: array
      description: 每页配图本地路径列表
    source_type:
      type: string
      description: 视频来源 local / url
    success:
      type: boolean
      description: 任务是否执行成功
